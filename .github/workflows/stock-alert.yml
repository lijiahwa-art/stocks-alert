name: Multi Stock Alerts (15min)

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分鐘跑
  workflow_dispatch:          # 可手動測試

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          pip3 install yfinance pandas numpy requests

      - name: Check and alert
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python3 - << 'PY'
          import os, datetime as dt, requests, yfinance as yf, pandas as pd

          TOKEN = os.getenv("LINE_TOKEN")
          USER  = os.getenv("LINE_USER_ID")

          # <<< 你可以改這兩行 >>>
          SYMBOLS    = ["QQQ","VOO","LEO","TSLA","NVDA","TSM","OKLO","GOOGL","AAPL","0050.TW","3189.TW","2317.TW","2330.TW","1504.TW"]   # 台股要 .TW
          THRESHOLDS = [0.01, 0.10]               # 1%、10% 回落
          # <<< 到此 >>>

          def send_line(text):
              headers={"Authorization":f"Bearer {TOKEN}","Content-Type":"application/json"}
              body={"to": USER, "messages":[{"type":"text","text": text}]}
              r=requests.post("https://api.line.me/v2/bot/message/push",
                              headers=headers, json=body, timeout=30)
              r.raise_for_status()

          def check_once(sym):
              df = yf.download(sym, period="max", interval="1d", auto_adjust=True, progress=False)
              if df.empty or len(df)<3:
                  return f"[WARN] no data for {sym}"
              c=df["Close"]; ath=float(c.max()); prev=float(c.iloc[-2]); last=float(c.iloc[-1])
              dd_prev=(ath-prev)/ath; dd_last=(ath-last)/ath
              crossed=[th for th in THRESHOLDS if dd_prev < th <= dd_last]
              if crossed:
                  levels=", ".join(f"{int(th*100)}%" for th in crossed)
                  msg=(f"📉 {sym} 回落觸發：{levels}\n"
                       f"現價 {last:.2f}｜ATH {ath:.2f}｜目前回落 {dd_last*100:.2f}%\n"
                       f"{dt.datetime.utcnow():%Y-%m-%d %H:%M} UTC")
                  send_line(msg)
                  return f"ALERT {sym} {levels}"
              return f"OK {sym} {dd_last*100:.2f}%"

          results = [check_once(s) for s in SYMBOLS]
          print("RESULT:", results, dt.datetime.utcnow())
          PY
